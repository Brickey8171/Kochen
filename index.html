<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kochbudget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7f1;--card:#ffffff;--ink:#2b211b;--muted:#8a7d72;--line:#eee4d8;
  --brown:#8b4a2b;--brown-ink:#ffffff;--yellow:#f5c84c;--yellow-soft:#fdf1c9;--yellow-ink:#5a4310;
  --green:#3f8f5a;--red:#c4513b;--red-soft:#f9e2dc;--chip:#f3ece2;--shadow:0 2px 10px rgba(80,50,20,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17130f;--card:#221c17;--ink:#f2eae1;--muted:#a89a8c;--line:#352c24;
  --brown:#c97a50;--brown-ink:#1a0f08;--yellow:#e6b93f;--yellow-soft:#3b3017;--yellow-ink:#f6dc94;
  --green:#5fbf80;--red:#e57a63;--red-soft:#3d221b;--chip:#2c241d;--shadow:0 2px 10px rgba(0,0,0,.35);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.serif,h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;letter-spacing:-.01em}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:16px 16px 100px;position:relative}
h1{font-size:1.75rem;line-height:1.15;margin:.3em 0 .25em}
h2{font-size:1.3rem;margin:0 0 .4em}
h3{font-size:1.05rem;margin:0}
.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
.muted{color:var(--muted)}.small{font-size:.85rem}.tiny{font-size:.75rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.btn{appearance:none;border:0;border-radius:14px;padding:15px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--brown);color:var(--brown-ink);width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.y{background:var(--yellow);color:#3a2a06}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.sm{width:auto;padding:9px 14px;font-size:.9rem;border-radius:11px}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.prog{height:4px;background:var(--line);border-radius:4px;margin:4px 0 22px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--brown);transition:width .3s}
.back{border:0;background:none;color:var(--muted);font:inherit;padding:4px 0;cursor:pointer}
.footer{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:4}
.footer>div{max-width:448px;margin:0 auto}
.plz{font:600 2.2rem/1 "Fraunces",Georgia,serif;letter-spacing:.3em;text-align:center;border:0;border-bottom:2px solid var(--line);background:none;color:var(--ink);width:100%;padding:18px 0;outline:none}
.plz:focus{border-color:var(--brown)}
.globe{font-size:6rem;text-align:center;margin:60px 0 20px;animation:spin 1.6s ease-in-out infinite}
@keyframes spin{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px 10px;font:inherit;font-size:.88rem;cursor:pointer;text-align:center;position:relative;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tile .e{font-size:1.6rem}
.tile.on{border-color:var(--brown);background:var(--yellow-soft)}
.tile.on::after{content:"✓";position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--brown);color:var(--brown-ink);font-size:.75rem;display:grid;place-items:center}
.tile:disabled{opacity:.35;cursor:not-allowed}
.list-tiles .tile{flex-direction:row;justify-content:flex-start;min-height:0;padding:12px 14px;text-align:left}
.list-tiles .tile .e{font-size:1.2rem}
.stepper{display:flex;align-items:center;justify-content:center;gap:24px}
.stepper button{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:1.4rem;cursor:pointer}
.stepper b{font:600 3rem/1 "Fraunces",Georgia,serif;min-width:60px;text-align:center}
.days{display:flex;gap:6px;justify-content:space-between}
.days button{flex:1;aspect-ratio:1/1.25;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:600 .9rem system-ui;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.days button.on{background:var(--yellow-soft);border-color:var(--brown)}
.days button i{font-style:normal;font-size:.7rem;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.days button.on i{background:var(--brown);border-color:var(--brown);color:var(--brown-ink)}
.bignum{font:700 4rem/1 "Fraunces",Georgia,serif;text-align:center;margin:30px 0 6px}
input[type=range]{width:100%;accent-color:var(--brown);height:30px}
input[type=text],input[type=search],select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:.9rem;padding:9px 4px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--card);font-weight:600;box-shadow:var(--shadow)}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--brown)}
.kitchen{background:linear-gradient(180deg,#e9894a,#d9733a);border-radius:22px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kitchen button{border:0;border-radius:14px;background:rgba(255,255,255,.22);color:#fff;font:600 .9rem system-ui;padding:16px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.kitchen button .e{font-size:2rem;filter:grayscale(.6) opacity(.7)}
.kitchen button.on{background:#fff7e6;color:#5a2e14}
.kitchen button.on .e{filter:none}
.kitchen button.on::after{content:"✓";position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--yellow);color:#3a2a06;font-size:.75rem;display:grid;place-items:center}
.checks{list-style:none;padding:0;margin:24px 0 0}
.checks li{display:flex;gap:10px;align-items:center;padding:8px 0;color:var(--muted);font-size:.95rem}
.checks li i{font-style:normal;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.7rem;flex-shrink:0}
.checks li.done{color:var(--ink)}.checks li.done i{background:var(--green);border-color:var(--green);color:#fff}
.checks li.run i{border-color:var(--yellow);border-top-color:transparent;animation:rot .8s linear infinite}
.checks li.fail i{background:var(--red);border-color:var(--red);color:#fff}
@keyframes rot{to{transform:rotate(360deg)}}
.basket{font-size:5rem;text-align:center;margin:40px 0 0;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.brand{display:flex;justify-content:center;align-items:center;gap:6px;font:700 1.1rem "Fraunces",Georgia,serif;color:var(--brown)}
.hello{text-align:center;font-size:2rem;margin:8px 0 2px}
.planfor{text-align:center;margin-bottom:16px}
.planfor select{width:auto;display:inline-block;padding:4px 8px;border-radius:8px;font-size:.9rem;border-color:transparent;background:var(--chip)}
.einkauf{border-radius:20px;overflow:hidden;position:relative;color:#fff;padding:18px;min-height:170px;background:
 radial-gradient(circle at 15% 20%,#6b3a1c 0,transparent 35%),radial-gradient(circle at 70% 80%,#3d4a1f 0,transparent 40%),radial-gradient(circle at 40% 60%,#7a2d16 0,transparent 30%),#26170e;margin-bottom:12px;cursor:pointer}
.einkauf .deco{position:absolute;font-size:1.6rem;opacity:.85}
.einkauf .txt{position:relative;z-index:1;max-width:48%;display:flex;flex-direction:column;justify-content:flex-end;height:134px}
.pill{display:inline-block;background:var(--yellow);color:#3a2a06;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.82rem;margin-top:10px;width:max-content}
.receipt{position:absolute;right:14px;top:14px;width:46%;background:#fffdf8;color:#2b211b;border-radius:4px;padding:10px 10px 8px;transform:rotate(2deg);box-shadow:0 6px 16px rgba(0,0,0,.35);font:500 .68rem/1.5 ui-monospace,Menlo,monospace}
.receipt .r{display:flex;justify-content:space-between}
.receipt .tot{border-top:1px dashed #b9ab9b;margin-top:5px;padding-top:4px;font-size:.78rem;font-weight:700}
.barcode{height:18px;margin-top:6px;background:repeating-linear-gradient(90deg,#2b211b 0 1px,transparent 1px 3px,#2b211b 3px 5px,transparent 5px 6px,#2b211b 6px 7px,transparent 7px 9px)}
.ring{display:flex;gap:16px;align-items:center}
.ring svg{flex-shrink:0}
.ok{color:var(--green)}.bad{color:var(--red)}
.day{display:flex;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}
.day .strip{width:46px;background:var(--yellow);color:#3a2a06;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.day .strip small{font-size:.65rem;letter-spacing:.05em}
.day .strip b{font:700 1.2rem "Fraunces",Georgia,serif}
.day.left .strip{background:var(--chip);color:var(--muted)}
.day .body{display:flex;gap:12px;align-items:center;padding:10px;flex:1;min-width:0}
.thumb{width:68px;height:68px;border-radius:14px;object-fit:cover;background:var(--chip);flex-shrink:0}
.ttl{font:600 1rem/1.25 "Fraunces",Georgia,serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:999px;background:var(--yellow-soft);color:var(--yellow-ink);font-weight:600;margin:4px 4px 0 0}
.meta{font-size:.8rem;color:var(--muted);margin-top:3px}
.iconbtn{border:0;background:var(--chip);color:var(--ink);border-radius:10px;width:36px;height:36px;font-size:1rem;cursor:pointer;flex-shrink:0}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;padding:0 12px calc(10px + env(safe-area-inset-bottom))}
.nav>div{max-width:456px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;display:flex;box-shadow:0 4px 20px rgba(0,0,0,.12);padding:6px}
.nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:.72rem;padding:6px 2px;border-radius:14px;cursor:pointer}
.nav button i{display:block;font-style:normal;font-size:1.25rem}
.nav button.on{background:var(--yellow-soft);color:var(--ink);font-weight:600}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto}
.overlay .in{max-width:480px;margin:0 auto;padding-bottom:110px}
.hero{position:relative;height:260px;background:var(--chip)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .iconbtn{position:absolute;top:14px;background:rgba(255,255,255,.9);color:#2b211b}
.pad{padding:16px}
.ing{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.ing:last-child{border-bottom:0}
.ing .a{color:var(--muted);font-size:.85rem;white-space:nowrap}
.step{display:flex;gap:12px;margin-bottom:16px}
.step .ic{width:40px;height:40px;border-radius:50%;background:var(--yellow-soft);display:grid;place-items:center;font-size:1.1rem;flex-shrink:0}
.step small{display:block;font-size:.7rem;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:2px}
.cmp{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:.9rem}
.best{color:var(--green);font-weight:700}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-left:5px;vertical-align:middle}
.aisle{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 4px}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li input{width:22px;height:22px;accent-color:var(--brown);flex-shrink:0}
.li.done .grow{opacity:.45;text-decoration:line-through}
.cook{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.cook .in{max-width:480px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.cook .txt{font:500 1.35rem/1.45 "Fraunces",Georgia,serif;flex:1;overflow:auto;margin:20px 0}
.dots{display:flex;gap:5px}.dots span{flex:1;height:4px;border-radius:4px;background:var(--line)}.dots span.on{background:var(--brown)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chips button{flex-shrink:0;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:.85rem;cursor:pointer}
.chips button.on{background:var(--yellow-soft);border-color:var(--brown);font-weight:600}
.note{font-size:.75rem;color:var(--muted);text-align:center;margin:18px 0 0}
.warn{background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 12px;font-size:.88rem;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:50;font-size:.9rem}
a{color:var(--brown)}
.ico{width:1em;height:1em;vertical-align:-.14em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tile .e,.kitchen button .e{display:inline-flex;color:var(--brown)}
.kitchen button .e{color:inherit}
.globe,.basket{color:var(--brown)}
.einkauf .deco{color:var(--yellow);opacity:.55}
.iconbtn{display:inline-flex;align-items:center;justify-content:center}
.iconbtn.on{color:var(--red)}
</style>
</head>

function norm(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ')
    .split(/\s+/).filter(Boolean).map(w=>w.length>3?w.replace(/oes$/,'o').replace(/ies$/,'y').replace(/([^s])s$/,'$1'):w).join(' ');
}

  const o={id:'i'+i,de,u,p:+p,pack:+pack||1,w:+w||100,d:+d||1,aisle,f:(flags||'').split(',').filter(Boolean),
    q:(qq[0]||de.toLowerCase()).split(',').map(s=>s.trim()).filter(Boolean),x:(qq[1]||'').split(',').map(s=>s.trim()).filter(Boolean)};
  DB[o.id]=o;

});
KEYS.sort((a,b)=>b[0].length-a[0].length);
function matchIng(name){
  const n=norm(name);if(!n)return null;
  for(const [k,id] of KEYS)if(k===n)return id;
  const padded=' '+n+' ';
  for(const [k,id] of KEYS)if(padded.includes(' '+k+' '))return id;
  return null;
}

/* ---------- Mengenangaben parsen ---------- */
const FR={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125};
const UNITS=[[/^(kg|kgs|kilos?|kilograms?)\b/,'g',1000],[/^(g|gr|grams?|gramm)\b/,'g',1],[/^(ml|millilit(?:re|er)s?)\b/,'ml',1],[/^cl\b/,'ml',10],[/^dl\b/,'ml',100],
  [/^(l|lit(?:re|er)s?)\b/,'ml',1000],[/^fl\.? ?oz\b/,'ml',30],[/^cups?\b/,'ml',240],[/^(tbsp|tbs|tblsp|tbls|tablespoons?|tbsps)\b/,'ml',15],[/^(tsp|tsps|teaspoons?)\b/,'ml',5],
  [/^(oz|ounces?)\b/,'g',28],[/^(lbs?|pounds?)\b/,'g',454],[/^pints?\b/,'ml',570],[/^(cans?|tins?)\b/,'g',400],[/^cloves?\b/,'g',5],[/^slices?\b/,'g',30],
  [/^sprigs?\b/,'g',2],[/^(bunch|bunches)\b/,'g',30],[/^handfuls?\b/,'g',30],[/^(pinch|pinches)\b/,'g',0.5],[/^(dash|splash|drizzle)\b/,'ml',5],
  [/^knobs?\b/,'g',15],[/^(packets?|packs?|bags?|jars?|pots?|tubs?|boxe?s?)\b/,'pack',1]];
function parseMeasure(m){
  let s=String(m||'').toLowerCase().trim();
  for(const k in FR)s=s.replace(new RegExp('(\\d)?\\s*'+k),(a,d)=>(d?(+d+FR[k]):FR[k])+' ');
  let q=null,mm;
  if((mm=s.match(/^(\d+)\s+(\d+)\/(\d+)/))){q=+mm[1]+mm[2]/mm[3];s=s.slice(mm[0].length);}
  else if((mm=s.match(/^(\d+)\/(\d+)/))){q=mm[1]/mm[2];s=s.slice(mm[0].length);}
  else if((mm=s.match(/^(\d+(?:[.,]\d+)?)(?:\s*(?:-|to)\s*\d+(?:[.,]\d+)?)?/))){q=parseFloat(mm[1].replace(',','.'));s=s.slice(mm[0].length);}
  s=s.trim();
  for(const [re,k,f] of UNITS)if(re.test(s))return {q:(q==null?1:q)*f,k,tiny:k==='g'&&f<1||/^(dash|splash|drizzle)/.test(s)};
  if(q==null){
    if(/taste|garnish|season|pinch|sprinkl|to serve|for frying|greas|dusting|optional|as required|as needed/.test(s)||!s)return {q:1,k:'g',tiny:true};
    return {q:1,k:'stk'};
  }
  return {q,k:'stk'};
}
function toBase(I,pm){
  const {q,k}=pm;
  if(k==='pack')return I.pack*q;
  if(k===I.u)return q;
  if(I.u==='g')return k==='ml'?q*I.d:q*I.w;
  if(I.u==='ml')return k==='g'?q/I.d:q*I.w;
  return q/I.w;
}

let LIVE=ls.get('kb_live');let SPC={};
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return Math.abs(h);}
function sp(id,store){
  const k=id+'|'+store;if(SPC[k])return SPC[k];
  const I=DB[id],st=storeById(store);
  const L=LIVE&&LIVE.p&&LIVE.p[st.ds]&&LIVE.p[st.ds][id];
  let r;
  if(L)r={u:L.p/L.q,q:L.q,p:L.p,live:true,name:L.n};
  else{
    const v=((hash(k)%15)-7)/100,unit=(I.u==='stk'?I.p:I.p/1000)*st.m*(1+v);
    const p=Math.max(0.19,Math.round(unit*I.pack*10)/10-0.01);
    r={u:p/I.pack,q:I.pack,p,live:false};
  }
  return SPC[k]=r;
}
function processLive(items){
  if(!Array.isArray(items))throw new Error('Unerwartetes Format');
  const want=new Set(STORES.map(s=>s.ds)),ings=Object.values(DB).filter(I=>!I.f.includes('free')),by={};
  let n=0;
  for(const it of items){
    const st=String(it.store||'').toLowerCase();if(!want.has(st))continue;
    let unit=String(it.unit||'').toLowerCase(),q=+it.quantity||0;const price=+it.price;
    if(!price||!q)continue;
    if(unit==='kg'){unit='g';q*=1000;}else if(unit==='l'){unit='ml';q*=1000;}else if(/^st/.test(unit))unit='stk';
    const name=String(it.name||'').toLowerCase();
    for(const I of ings){
      let qq=q;
      if(I.u!==unit){if(I.u==='g'&&unit==='ml')qq=q*I.d;else if(I.u==='ml'&&unit==='g')qq=q/I.d;else continue;}
      if(qq<I.pack*0.15||qq>I.pack*6)continue;
      if(!I.q.some(t=>name.includes(t)))continue;
      if(I.x.some(t=>name.includes(t)))continue;
      ((by[st]=by[st]||{})[I.id]=by[st][I.id]||[]).push({u:price/qq,q:qq,p:price,n:it.name});n++;
    }
  }
  const p={};
  for(const st in by){p[st]={};for(const id in by[st]){const l=by[st][id].sort((a,b)=>a.u-b.u);const c=l[Math.floor(l.length*0.2)];p[st][id]={q:Math.round(c.q),p:c.p,n:c.n};}}
  if(!Object.keys(p).length)throw new Error('Keine passenden Produkte gefunden');
  LIVE={t:Date.now(),p};SPC={};
  ls.set('kb_live',LIVE);
  return n;
}

function recipeCost(r,store,F){

function buildList(entries,store){

  const items=[];let total=0;

    const pantry=S.pantry&&I.f.includes('p'),pr=sp(id,store),packs=Math.max(1,Math.ceil(agg[id]/pr.q-1e-9)),cost=pantry?0:packs*pr.p;

function slots(){
  const d=S.days.slice().sort((a,b)=>a-b),out=[];
  for(let i=0;i<d.length;i++){
    if(S.reste&&i+1<d.length&&d[i+1]===d[i]+1){out.push({d:d[i],cook:true,mult:2});out.push({d:d[i+1],cook:false});i++;}
    else out.push({d:d[i],cook:true,mult:1});
  }
  return out;
}
function pickWeighted(pool,n){
  const p=pool.slice(),out=[];
  while(out.length<n&&p.length){
    let tot=p.reduce((a,r)=>a+score(r),0),x=Math.random()*tot,i=0;
    for(;i<p.length;i++){x-=score(p[i]);if(x<=0)break;}
    out.push(p.splice(Math.min(i,p.length-1),1)[0]);
  }
  while(out.length<n)out.push(pool[Math.floor(Math.random()*pool.length)]);
  return out;
}
function generatePlan(){
  const sl=slots(),cookSlots=sl.filter(s=>s.cook),pool=MEALS.filter(forPlan);
  S.checked={};S.planStore=null;
  if(!pool.length||!cookSlots.length){S.plan=[];return;}
  let best=null,cheap=null;
  for(let t=0;t<350;t++){
    const rs=pickWeighted(pool,cookSlots.length);
    const ent=rs.map((r,i)=>({r,mult:cookSlots[i].mult}));
    const c=cheapest(s=>buildList(ent,s).total).c;
    const sc=rs.reduce((a,r)=>a+score(r),0)+Math.random()*2;
    if(!cheap||c<cheap.c)cheap={rs,c};
    if(c<=S.budget&&(!best||sc>best.sc))best={rs,sc};
  }
  const rs=(best||cheap).rs;let k=0,last=null;
  S.plan=sl.map(s=>{if(s.cook){last=rs[k++].id;return {d:s.d,cook:true,mult:s.mult,rid:last};}return {d:s.d,cook:false,rid:last};});
}
function swapSlot(i){
  const sl=S.plan[i];if(!sl||!sl.cook)return;
  const used=new Set(S.plan.map(s=>s.rid)),pool=MEALS.filter(r=>forPlan(r)&&!used.has(r.id));
  if(!pool.length)return toast('Keine weiteren passenden Rezepte');
  let fb=null;
  for(const r of pickWeighted(pool,Math.min(60,pool.length))){
    const ent=S.plan.map((s,j)=>s.cook?{r:j===i?r:RM[s.rid],mult:s.mult}:null).filter(Boolean);
    const c=cheapest(s=>buildList(ent,s).total).c;
    if(c<=S.budget){fb={r};break;}
    if(!fb||c<fb.c)fb={r,c};
  }
  setSlot(i,fb.r.id);
}
function setSlot(i,rid){
  const old=S.plan[i].rid;S.plan[i].rid=rid;
  if(S.plan[i+1]&&!S.plan[i+1].cook&&S.plan[i+1].rid===old)S.plan[i+1].rid=rid;
  S.checked={};
}

async function build(){
  S.screen='loading';
  UI.loadSteps=[{t:'Wir lesen deine Antworten',st:'done'},{t:'Rezepte werden geladen',st:'run'},{t:'Preise für deine Supermärkte',st:''},{t:`Die Woche bleibt unter ${S.budget} €`,st:''},{t:'Wir erstellen eine übersichtliche Einkaufsliste',st:''}];
  render();
  const step=(i,st,t)=>{UI.loadSteps[i].st=st;if(t)UI.loadSteps[i].t=t;render();};
  try{setMeals(await fetchMeals());step(1,'done',`${MEALS.length} Rezepte geladen`);}
  catch(e){step(1,'fail',navigator.onLine===false?'Rezepte konnten nicht geladen werden: keine Internetverbindung.':'Rezepte konnten nicht geladen werden. Wahrscheinlich blockiert die Vorschau den Internetzugriff (z. B. in der Claude- oder Dateien-App). Öffne die Datei in einem richtigen Browser wie Safari oder Chrome oder über eine Webadresse.');
    UI.loadSteps.push({t:'<button class="btn sm" data-a="build">Nochmal versuchen</button> <button class="btn sm ghost" data-a="toOb">Zurück</button>',st:''});render();return;}
  step(2,'run');
  let ok=liveFresh();
  if(!ok)ok=await loadLive();
  const ls_=liveStores();
  step(2,ok&&ls_.length?'done':'done',ok&&ls_.length?`Aktuelle Preise für ${ls_.map(s=>storeById(s).n).join(', ')}`:'Preise geschätzt (Live-Preise nicht erreichbar)');
  step(3,'run');await new Promise(r=>setTimeout(r,50));
  if(!MEALS.some(forPlan)){step(3,'fail','Keine Rezepte passen zu deinen Angaben. Lockere Filter oder wähle mehr Geräte.');
    UI.loadSteps.push({t:'<button class="btn sm" data-a="toOb">Angaben ändern</button>',st:''});render();return;}
  generatePlan();
  const tot=buildList(planEntries(),planStore()).total;
  step(3,tot<=S.budget?'done':'fail',tot<=S.budget?`Die Woche bleibt unter ${S.budget} €`:`Günstigster Plan: ${eurR(tot)} (über Budget)`);
  step(4,'done');
  await new Promise(r=>setTimeout(r,700));
  S.screen='main';S.tab='plan';render();window.scrollTo(0,0);
  translateTitles(S.plan.map(s=>RM[s.rid]));
}

}
function renderList(){
  const ent=planEntries(),st=UI.listStore&&S.shops.includes(UI.listStore)?UI.listStore:planStore(),L=buildList(ent,st);
  const buy=L.items.filter(i=>!i.pantry),pantry=L.items.filter(i=>i.pantry);
  const open=buy.filter(i=>!S.checked[i.key]).reduce((a,i)=>a+i.cost,0);
  const groups=AISLE_ORDER.map(a=>[a,buy.filter(i=>i.aisle===a).sort((x,y)=>x.name.localeCompare(y.name))]).filter(g=>g[1].length);
  return `<div class="overlay"><div class="in pad">
    <div class="row between"><button class="iconbtn" data-a="closeList" aria-label="Zurück">${ic("back")}</button><h2 style="margin:0">Einkaufsliste</h2><button class="iconbtn" data-a="share" aria-label="Teilen">${ic("share")}</button></div>
    <div class="card" style="margin-top:14px"><div class="row between"><select data-a="listStore" style="width:auto">${S.shops.map(s=>`<option value="${s}" ${s===st?'selected':''}>${storeById(s).n}</option>`).join('')}</select>
      <div style="text-align:right"><div class="serif" style="font-size:1.4rem;font-weight:700">${eur(L.total)}</div><div class="tiny muted">noch offen: ${eur(open)}</div></div></div></div>
    ${groups.map(([a,items])=>`<div class="aisle">${AISLE[a]}</div>${items.map(i=>`<label class="li ${S.checked[i.key]?'done':''}"><input type="checkbox" data-a="check" data-v="${esc(i.key)}" ${S.checked[i.key]?'checked':''}>
      <span class="grow">${esc(i.name)}${i.live?'<span class="livedot" title="Live-Preis"></span>':''}<br><span class="tiny muted">${i.est?'Preis geschätzt':`${i.packs}× ${fmtPack(i.I,i.q)} · benötigt ${fmtAmt(i.I,i.amt)}`}</span></span><span class="small">${eur(i.cost)}</span></label>`).join('')}`).join('')}
    ${pantry.length?`<div class="aisle">Hast du vermutlich zuhause</div><p class="small muted">${pantry.map(i=>i.name).join(', ')}</p>`:''}
    <p class="note">Ganze Packungen gerechnet. Grüner Punkt = Live-Preis, sonst Schätzung.</p>
  </div></div>`;
}
function renderCook(){
  const r=RM[UI.cook.id];if(!r)return '';
  const steps=TR['steps:'+r.id]||r.steps,i=UI.cook.i;
  return `<div class="cook"><div class="in">
    <div class="row between"><button class="iconbtn" data-a="cookClose" aria-label="Schließen">${ic("x")}</button><span class="small muted">Schritt ${i+1} von ${steps.length}</span><span style="width:36px"></span></div>
    <div class="dots" style="margin-top:14px">${steps.map((_,j)=>`<span class="${j<=i?'on':''}"></span>`).join('')}</div>
    <div class="txt"><div style="font-size:2.2rem;margin-bottom:10px;color:var(--brown)">${ic(stepKind(r.steps[i]||steps[i])[0])}</div>${esc(steps[i])}</div>
    <div class="row"><button class="btn ghost" data-a="cookPrev" ${i===0?'disabled':''}>Zurück</button><button class="btn ${i===steps.length-1?'y':''}" data-a="cookNext">${i===steps.length-1?'Fertig '+ic('check'):'Weiter'}</button></div>
  </div></div>`;
}

/* ---------- Events ---------- */
app.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el||el.tagName==='SELECT'||el.tagName==='INPUT')return;
  const a=el.dataset.a,v=el.dataset.v;
  const tog=(arr,x)=>arr.includes(x)?arr.filter(y=>y!==x):arr.concat(x);
  switch(a){
    case 'obNext':
      S.ob++;
      if(OB[S.ob]==='locate'){render();setTimeout(()=>{S.shops=S.shops.filter(id=>storeOK(storeById(id)));S.ob++;render();},1500);return;}
      break;
    case 'obBack':S.ob--;if(OB[S.ob]==='locate')S.ob--;break;
    case 'shop':S.shops=tog(S.shops,v);SPC={};break;
    case 'inc':S[el.dataset.k]=Math.min(12,S[el.dataset.k]+1);break;
    case 'dec':S[el.dataset.k]=Math.max(el.dataset.k==='adults'?1:0,S[el.dataset.k]-1);break;
    case 'day':S.days=tog(S.days,+v);break;
    case 'app':if(S.appetite.includes(v))S.appetite=S.appetite.filter(x=>x!==v);else if(S.appetite.length<3)S.appetite=S.appetite.concat(v);else toast('Maximal 3');break;
    case 'diet':S.diet=v;break;
    case 'maxTime':S.maxTime=+v;if(S.screen==='main'&&MEALS.length){generatePlan();toast(S.plan.length?'Plan neu erstellt':'Keine Rezepte in dieser Zeit');translateTitles(S.plan.map(x=>RM[x.rid]));}break;
    case 'dis':S.dislikes=tog(S.dislikes,v);break;
    case 'all':S.allergies=tog(S.allergies,v);break;
    case 'tool':S.tools=tog(S.tools,v);break;
    case 'build':build();return;
    case 'toOb':S.screen='ob';S.ob=0;UI.open=null;UI.list=false;render();window.scrollTo(0,0);return;
    case 'tab':S.tab=v;render();window.scrollTo(0,0);if(v==='explore')translateTitles(exploreList().slice(0,12));return;
    case 'open':if(e.target.closest('[data-a="swap"],[data-a="fav"]'))return;UI.open=v;UI.from=el.dataset.from||'plan';render();document.querySelector('.overlay').scrollTop=0;translateTitles([RM[v]]);return;
    case 'close':UI.open=null;break;
    case 'fav':e.stopPropagation();S.favs=tog(S.favs,v);break;
    case 'swap':e.stopPropagation();swapSlot(+v);translateTitles(S.plan.map(s=>RM[s.rid]));break;
    case 'swapDetail':swapSlot(+v);UI.open=S.plan[+v].rid;translateTitles([RM[UI.open]]);break;
    case 'putPlan':{const i=+document.getElementById('slotSel').value;setSlot(i,v);UI.open=null;S.tab='plan';toast('Eingeplant für '+DAYL[S.plan[i].d]);break;}
    case 'reroll':generatePlan();translateTitles(S.plan.map(s=>RM[s.rid]));break;
    case 'openList':UI.list=true;UI.listStore=null;render();document.querySelector('.overlay').scrollTop=0;return;
    case 'closeList':UI.list=false;break;
    case 'share':shareList();return;
    case 'cook':UI.cook={id:UI.open,i:0};break;
    case 'cookClose':UI.cook=null;break;
    case 'cookPrev':UI.cook.i=Math.max(0,UI.cook.i-1);break;
    case 'cookNext':{const r=RM[UI.cook.id],n=(TR['steps:'+r.id]||r.steps).length;if(UI.cook.i>=n-1){UI.cook=null;toast('Guten Appetit!');}else UI.cook.i++;break;}
    case 'trSteps':{const r=RM[v];UI.trBusy=true;render();
      try{const out=[];for(const s of r.steps)out.push(await translate(s));TR['steps:'+r.id]=out;saveTR();if(!TR[r.n])await translate(r.n).catch(()=>{});}
      catch(err){toast('Übersetzung gerade nicht möglich: '+err.message);}
      UI.trBusy=false;break;}
    case 'exCat':S.exCat=v;S.exN=40;break;
    case 'more':S.exN+=40;break;
    case 'live':toast('Lade Preise… das kann etwas dauern');{const ok=await loadLive();toast(ok?'Live-Preise geladen':'Nicht erreichbar: '+UI.priceMsg);}break;
    case 'noLive':LIVE=null;SPC={};try{localStorage.removeItem('kb_live');}catch(err){}break;
    case 'reloadMeals':toast('Lade Rezepte…');try{setMeals(await fetchMeals(true));toast(MEALS.length+' Rezepte geladen');}catch(err){toast(err.message);}break;
    case 'reset':if(confirm('Alle Angaben und den Plan löschen?')){try{['kb3','kb_live','kb_tr'].forEach(k=>localStorage.removeItem(k));}catch(err){}S=Object.assign({},DEF);LIVE=null;TR={};SPC={};UI={open:null,list:false,cook:null,loadSteps:[],priceMsg:''};}break;
    default:return;
  }
  render();
});
app.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.a;
  if(t.id==='pricefile'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const n=processLive(JSON.parse(fr.result));toast(n+' Produkte zugeordnet');}catch(err){toast('Datei ungültig: '+err.message);}render();};fr.readAsText(t.files[0]);return;}
  if(a==='planStore'){S.planStore=t.value;}
  else if(a==='listStore'){UI.listStore=t.value;}
  else if(a==='check'){S.checked[t.dataset.v]=t.checked;}
  else if(a==='reste')S.reste=t.checked;
  else if(a==='pantry')S.pantry=t.checked;
  else if(a==='autoTr'){S.autoTr=t.checked;if(S.autoTr)translateTitles(S.plan.map(s=>RM[s.rid]));}
  else if(a==='exAll'){S.exAll=t.checked;S.exN=40;}
  else return;
  const ov=document.querySelector('.overlay'),st=ov?ov.scrollTop:0;
  render();
  const ov2=document.querySelector('.overlay');if(ov2)ov2.scrollTop=st;
});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='plz'){
    t.value=t.value.replace(/\D/g,'').slice(0,4);S.plz=t.value;
    const reg=region(S.plz);document.getElementById('reg').innerHTML=reg?ic('pin')+' '+reg:'4-stellige österreichische Postleitzahl';
    document.querySelector('[data-a="obNext"]').disabled=!reg;save();
  }
  if(t.id==='budget'){S.budget=+t.value;document.getElementById('bn').textContent=S.budget+' €';save();}
  if(t.id==='exq'){S.exQ=t.value;S.exN=40;document.getElementById('exlist').innerHTML=exploreCards();save();}
});
app.addEventListener('keydown',e=>{if(e.target.id==='plz'&&e.key==='Enter'&&region(S.plz)){S.ob=0;document.querySelector('[data-a="obNext"]').click();}});
app.addEventListener('error',e=>{const t=e.target;if(t.tagName==='IMG'&&/\/preview$/.test(t.src))t.src=t.src.replace(/\/preview$/,'');},true);
async function shareList(){
  const st=UI.listStore&&S.shops.includes(UI.listStore)?UI.listStore:planStore(),L=buildList(planEntries(),st);
  const txt=`Einkaufsliste (${storeById(st).n}) – ${eur(L.total)}\n`+AISLE_ORDER.map(a=>{const it=L.items.filter(i=>!i.pantry&&i.aisle===a&&!S.checked[i.key]);return it.length?`\n${AISLE[a]}\n`+it.map(i=>`- ${i.est?'':i.packs+'× '}${i.name}`).join('\n'):'';}).join('');
  try{if(navigator.share){await navigator.share({title:'Einkaufsliste',text:txt});return;}}catch(e){if(e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(txt);toast('Liste kopiert');}catch(e){prompt('Liste kopieren:',txt);}
}

/* ---------- Start ---------- */
(async function init(){
  if(S.screen==='main'){
    const c=ls.get('kb_meals');
    if(c&&c.meals){setMeals(c.meals);render();translateTitles(S.plan.map(s=>RM[s.rid]));}
    else{render();try{setMeals(await fetchMeals());if(!S.plan.length||S.plan.some(s=>!RM[s.rid]))generatePlan();}catch(e){toast(e.message);}render();}
  }else{
    if(OB[S.ob]==='locate')S.ob++;
    render();
  }
})();
</script>
</body>
</html>
